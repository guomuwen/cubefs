#!/bin/bash
# =============================================================================
# dlio_libsdk.conf — CubeFS LD_PRELOAD + DLIO 配置文件
#
# 所有环境变量的说明和默认值。
# 被 run_dlio_libsdk.sh 读取。
# =============================================================================

# --- CubeFS 集群连接 ---
CFS_MASTER="7.32.209.207:17010,7.32.209.208:17010,7.32.209.209:17010"
CFS_VOL="ltptest"
CFS_AK="xDvsKEC3NKg1tou5"
CFS_SK="L2IaeAUWex2kaavomE0TleDrwRLYufFd"

# --- 挂载点前缀（用于路径拦截匹配）---
CFS_MOUNT_POINT="/mnt/cfs/"

# --- bcache 本地 SSD 缓存目录（分号分隔）---
CFS_BCACHE_DIRS="/bcache0;/bcache1;/bcache2;/bcache3;/bcache4"

# --- libcfs.so 路径 ---
CFS_LIBCFS_SO="/home/guomuwen/cubefs/build/bin/libcfs.so"

# --- 日志 ---
CFS_LOG_DIR="/tmp/cfs_preload_log"
CFS_LOG_LEVEL="error"   # debug / info / warn / error

# --- LD_PRELOAD 库路径 ---
PRELOAD_SO="/home/guomuwen/cubefs/client/preload/libcfs_preload.so"

# --- DLIO 参数 ---
DLIO_DATA_FOLDER="/mnt/cfs/mlperf_data/resnet_copy_400g/train"
DLIO_NUM_FILES_TRAIN=4200000
DLIO_BATCH_SIZE=128
DLIO_READ_THREADS=16
DLIO_COMPUTATION_TIME=0.0
DLIO_EPOCHS=1
DLIO_FORMAT="tfrecord"

# --- MPI 参数 ---
MPI_HOSTFILE="/home/guomuwen/hfile64"
MPI_NP=24
MPI_NPERNODE=8
